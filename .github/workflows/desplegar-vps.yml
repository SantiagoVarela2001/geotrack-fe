name: Desplegar frontend en VPS

on:
  workflow_dispatch:

permissions: {}

jobs:
  desplegar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: geotrack-fe-produccion
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}

    steps:
      - name: Preparar acceso SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_HOST_PUBLIC_KEY: ${{ secrets.VPS_SSH_HOST_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_SSH_HOST_PUBLIC_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s %s\n' "$VPS_HOST" "$VPS_SSH_HOST_PUBLIC_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Actualizar frontend
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -i ~/.ssh/id_ed25519 root@"$VPS_HOST" desplegar
